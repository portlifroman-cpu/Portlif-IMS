name: Install Portlif pyrolysis photos
on:
  push:
    branches: [ChatGPT]
    paths:
      - 'portlif_pyrolysis_photos.zip'
      - '.github/workflows/install-pyrolysis-photos.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install-photos:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Portlif IMS
        uses: actions/checkout@v4
        with:
          ref: ChatGPT
          persist-credentials: true
      - name: Extract validated original photos
        shell: bash
        run: |
          set -euo pipefail
          test -f portlif_pyrolysis_photos.zip
          mkdir -p photos
          tmp="$(mktemp -d)"
          unzip -q portlif_pyrolysis_photos.zip -d "$tmp"
          for photo in reactor-loading-end.jpg reactor-drive.jpg heating-burners.jpg condensation-system.jpg control-panel.jpg cabero-cooler.jpg; do
            source_file="$(find "$tmp" -type f -name "$photo" -print -quit)"
            if [ -z "$source_file" ]; then
              echo "Missing expected photograph: $photo" >&2
              exit 1
            fi
            cp "$source_file" "photos/$photo"
          done
      - name: Commit real JPG files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add photos/reactor-loading-end.jpg photos/reactor-drive.jpg photos/heating-burners.jpg photos/condensation-system.jpg photos/control-panel.jpg photos/cabero-cooler.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Install six original pyrolysis photos for Portlif IMS"
            git push origin HEAD:ChatGPT
          fi
