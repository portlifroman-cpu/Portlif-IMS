<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PORTLIF IMS</title>
<style>
:root{--bg:#f4f7f9;--card:#fff;--ink:#17313b;--muted:#6d7f86;--line:#dbe5e9;--brand:#0f6070}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
.wrap{min-height:100vh;display:grid;place-items:center;padding:22px}
.card{width:min(620px,100%);background:var(--card);border:1px solid var(--line);border-radius:22px;padding:30px;box-shadow:0 12px 32px rgba(25,55,65,.09)}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.mark{width:50px;height:50px;border-radius:13px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:900;font-size:22px}
h1{margin:0;font-size:30px}.sub{color:var(--muted);margin-top:5px}
a.btn{display:block;text-decoration:none;background:var(--brand);color:#fff;padding:14px 16px;border-radius:12px;font-weight:800;text-align:center;margin-top:22px}
.info{margin-top:18px;padding:14px;border-radius:12px;background:#edf5f6;color:#36545c;font-size:14px;line-height:1.45}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="brand">
      <div class="mark">P</div>
      <div><h1>PORTLIF IMS</h1><div class="sub">Portlif Grupp OÜ · CRM + ISO</div></div>
    </div>
    <p>Система управления Portlif: контрагенты, партии, лаборатория, ADR-логистика, документы, оборудование и ISO/QHSE.</p>
    <a class="btn" href="https://fsagcbmysufzfneywrlp.supabase.co/functions/v1/portlif-ims">Войти в Portlif IMS</a>
    <div class="info">Этот адрес обслуживается Vercel как обычный веб-сайт и должен корректно открываться в Safari на iPad.</div>
  </div>
</div>
</body>
</html>
